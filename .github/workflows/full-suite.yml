name: Full suite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  ci:
    name: CI/CD
    uses: ./.github/workflows/cicd.yml
    with:
      full: true

  report:
    name: Report
    needs: ci
    if: always() && needs.ci.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Hold automatic releases
        run: |
          echo "The full suite failed on main $GITHUB_SHA. Automatic qm-yc releases hold until a later full suite run on main passes." >>"$GITHUB_STEP_SUMMARY"
          exit 1
