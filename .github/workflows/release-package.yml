name: Build signed QM images

on:
  workflow_call:
    inputs:
      images:
        type: string
        required: false
      architecture:
        type: string
        required: false
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    env:
      ARCHITECTURE: ${{ inputs.architecture || 'amd64' }}
      SUFFIX: ${{ inputs.architecture && inputs.architecture != 'amd64' && format('-{0}', inputs.architecture) || '' }}
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.images || '["core","web-ui","admin","portal","auth","egress-proxy","sandbox-base"]') }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.name == 'sandbox-base' && 'fly/Dockerfile' || format('deploy/{0}/Dockerfile', matrix.name) }}
          platforms: linux/${{ env.ARCHITECTURE }}
          provenance: false
          push: true
          build-args: |
            ${{ matrix.name == 'sandbox-base' && 'INSTALL_BROWSER_ENGINE=1' || '' }}
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/yc-software/qm/${{ matrix.name }}:${{ github.sha }}${{ env.SUFFIX }}
          cache-from: type=gha,scope=qm-${{ matrix.name }}${{ env.SUFFIX }}
          cache-to: type=gha,mode=max,scope=qm-${{ matrix.name }}${{ env.SUFFIX }}
      - name: Sign exact image
        run: |
          image='ghcr.io/yc-software/qm/${{ matrix.name }}@${{ steps.build.outputs.digest }}'
          cosign sign --yes "$image"
          cosign verify "$image" \
            --certificate-identity='https://github.com/${{ github.repository }}/.github/workflows/release-package.yml@refs/heads/main' \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com
          printf '%s\n' "$image" > qm-${{ matrix.name }}.image
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qm-${{ matrix.name }}${{ env.SUFFIX }}-${{ github.sha }}
          path: qm-${{ matrix.name }}.image
          if-no-files-found: error
          retention-days: 30
          overwrite: true
