name: Slop-free zone

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: slop-free-zone-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  slop-free-zone:
    name: Slop-free zone
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check for new legacy names, flags, modes, blob tables, key-value helpers and comments
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/code-ratchets.ts --base "$BASE_SHA"
