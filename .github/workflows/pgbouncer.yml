name: PgBouncer compatibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  transaction-pooling:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
          cache: npm
      - run: npm ci
      - run: bash scripts/test-pgbouncer.sh
