<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Markdown rendering</title>
    <style>
      main {
        max-width: 820px;
        margin: 40px auto;
        padding: 0 24px 40px;
      }
      nav {
        display: flex;
        gap: 16px;
        margin-bottom: 32px;
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <nav><button id="theme">Toggle theme</button></nav>
      <article class="assistant-body" id="response"></article>
    </main>
    <script type="module">
      import "../../src/shell.css";
      import { render } from "lit";
      import { markdown } from "../../src/message-markdown";
      import text from "./markdown.md?raw";
      render(markdown(text), document.querySelector("#response"));
      document.querySelector("#theme").onclick = () => document.documentElement.classList.toggle("dark");
    </script>
  </body>
</html>
