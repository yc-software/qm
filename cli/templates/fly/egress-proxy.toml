app = "qm-egress-proxy"
primary_region = "sjc"

[env]
  QM_DEPLOYMENT_ID = "qm-v2:personal:acme:qm"
  CORE_API_URL = "http://qm-core.internal:8080"
  CORE_ORG_ID = "acme"

[[services]]
  internal_port = 48080
  protocol = "tcp"
  auto_stop_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

kill_signal = "SIGTERM"
kill_timeout = "10s"
