<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>
    Credential approval demo</title
  ><style>
    body {
      font: 16px/1.5 system-ui;
      margin: 60px auto;
      padding: 24px;
      max-width: 800px;
      color: #222;
    }
    h1 {
      font-size: 24px;
    }
    article {
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 12px;
      margin: 24px 0;
    }
    a {
      color: #1264a3;
    }
    button {
      background: white;
      border: 1px solid #999;
      border-radius: 5px;
      padding: 8px 16px;
      margin: 6px 8px 0 0;
      font: 600 14px system-ui;
      cursor: pointer;
    }
    button.primary {
      background: #007a5a;
      border-color: #007a5a;
      color: white;
    }
    button.danger {
      color: #b42332;
      border-color: #b42332;
    }
    small {
      display: block;
      color: #666;
      margin: 16px 0;
    }
    #conversation {
      margin-top: 50px;
    }
    section {
      padding: 20px;
      border: 2px solid #635bff;
      border-radius: 12px;
    }
  </style>
  <h1>Credential approval</h1>
  <p>
    Interactive preview using the production Block Kit payload and synthetic data. Slack's surrounding interface is
    represented by a minimal HTML renderer; button persistence is mocked here.
  </p>
  <article id="card"></article>
  <button id="reset">Reset preview</button>
  <div id="conversation">
    <h2>Originating conversation</h2>
    <section>Check the nightly build and capture a status screenshot.</section>
  </div>
  <script>
    const cards = {
      pending: {
        text: "Approval needed: use your AWS credential in the Build group. Check the nightly build and capture a status screenshot.",
        blocks: [
          {
            type: "section",
            text: {
              type: "mrkdwn",
              text: ":lock: *Approval needed.*\nUse your *AWS* credential <https://qm.example/s/build?seq=120|in the Build group>.\n*Why:* Check the nightly build and capture a status screenshot.",
            },
          },
          {
            type: "context",
            elements: [
              {
                type: "plain_text",
                text: "Allow once permits one credential use. Allow always permits future use in this conversation until revoked.",
              },
            ],
          },
          {
            type: "actions",
            block_id: "keychain_ask:demo",
            elements: [
              {
                type: "button",
                text: { type: "plain_text", text: "Allow once" },
                action_id: "keychain_allow_once",
                value: "demo",
                style: "primary",
              },
              {
                type: "button",
                text: { type: "plain_text", text: "Allow always" },
                action_id: "keychain_allow_always",
                value: "demo",
              },
              {
                type: "button",
                text: { type: "plain_text", text: "Deny" },
                action_id: "keychain_deny",
                value: "demo",
                style: "danger",
              },
            ],
          },
        ],
      },
      once: {
        text: "Approved — one-time access.",
        blocks: [
          {
            type: "section",
            text: {
              type: "mrkdwn",
              text: "*Approved — one-time access.*\nUse your *AWS* credential <https://qm.example/s/build?seq=120|in the Build group>.\n*Why:* Check the nightly build and capture a status screenshot.",
            },
          },
        ],
      },
      standing: {
        text: "Approved — ongoing access for this conversation.",
        blocks: [
          {
            type: "section",
            text: {
              type: "mrkdwn",
              text: "*Approved — ongoing access for this conversation.*\nUse your *AWS* credential <https://qm.example/s/build?seq=120|in the Build group>.\n*Why:* Check the nightly build and capture a status screenshot.",
            },
          },
        ],
      },
      declined: {
        text: "Denied.",
        blocks: [
          {
            type: "section",
            text: {
              type: "mrkdwn",
              text: "*Denied.*\nUse your *AWS* credential <https://qm.example/s/build?seq=120|in the Build group>.\n*Why:* Check the nightly build and capture a status screenshot.",
            },
          },
        ],
      },
    };
    const card = document.querySelector("#card");
    function mrkdwn(text) {
      return text
        .replace(/:lock:/g, "🔒")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/&lt;([^|]+)\|([^&]+)&gt;/g, '<a href="#conversation">$2</a>')
        .replace(/\*([^*]+)\*/g, "<strong>$1</strong>")
        .replace(/\n/g, "<br>");
    }
    function show(state) {
      card.replaceChildren();
      for (const block of cards[state].blocks) {
        if (block.type === "section") {
          const p = document.createElement("div");
          p.innerHTML = mrkdwn(block.text.text);
          card.append(p);
        }
        if (block.type === "context") {
          const p = document.createElement("small");
          p.textContent = block.elements[0].text;
          card.append(p);
        }
        if (block.type === "actions") {
          for (const action of block.elements) {
            const b = document.createElement("button");
            b.textContent = action.text.text;
            b.className = action.style || "";
            b.onclick = () =>
              show(
                action.action_id === "keychain_allow_once"
                  ? "once"
                  : action.action_id === "keychain_allow_always"
                    ? "standing"
                    : "declined",
              );
            card.append(b);
          }
        }
      }
    }
    document.querySelector("#reset").onclick = () => show("pending");
    show("pending");
  </script>
</html>
