version: v2
name: qm-core
build:
  method: docker
  context: .
  dockerfile: ./deploy/core/Dockerfile
services:
  - name: edge
    type: web
    run: node src/edge/main.ts
    instances: 1
    cpuCores: 1
    ramMegabytes: 2048
    port: 8000
    terminationGracePeriodSeconds: 300
    healthCheck:
      enabled: true
      httpPath: /healthz
  - name: harness
    type: worker
    run: node src/harness/main.ts
    instances: 1
    cpuCores: 1
    ramMegabytes: 2048
    terminationGracePeriodSeconds: 300
    livenessCheck:
      enabled: true
      command: curl -fsS http://127.0.0.1:8080/healthz
    readinessCheck:
      enabled: true
      command: curl -fsS http://127.0.0.1:8080/readyz
