version: v2
name: qm-core
build:
  method: docker
  context: .
  dockerfile: ./deploy/core/Dockerfile
services:
  - name: core
    type: web
    run: node src/index.ts
    instances: 1
    cpuCores: 1
    ramMegabytes: 2048
    port: 8080
    healthCheck:
      enabled: true
      httpPath: /healthz
---
version: v2
name: qm-auth
build:
  method: docker
  context: .
  dockerfile: ./deploy/auth/Dockerfile
services:
  - name: auth
    type: web
    run: node src/index.ts
    instances: 1
    cpuCores: 0.25
    ramMegabytes: 512
    port: 8080
