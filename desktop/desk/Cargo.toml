[package]
name = "desk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Let an agent see and drive macOS apps over JSON lines"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
signal-hook = "0.3"
sha2 = "0.10"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
html2text = { version = "0.17", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
core-foundation = "0.10"
core-graphics = { version = "0.24", features = ["highsierra", "elcapitan"] }
foreign-types = "0.5"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDate", "NSDateFormatter", "NSFormatter", "NSCalendar", "NSArray", "NSEnumerator", "NSData", "NSError"] }
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage", "CGEvent", "CGEventTypes", "CGWindow", "CGSession", "libc"] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = ["std", "libc", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSRunningApplication", "NSWorkspace", "NSPasteboard", "NSPasteboardItem", "NSEvent", "NSGraphicsContext", "NSFont", "NSFontDescriptor", "objc2-core-foundation"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
