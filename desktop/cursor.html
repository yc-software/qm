<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
      }
      #cursor,
      #pulse {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
      }
      #cursor {
        width: 26px;
        height: 30px;
        transform-origin: 2px 2px;
        filter: drop-shadow(0 2px 3px rgb(0 0 0 / 0.35));
        opacity: 0;
        transition: opacity 0.3s;
      }
      #cursor.shown {
        opacity: 1;
      }
      #pulse {
        width: 36px;
        height: 36px;
        margin: -18px 0 0 -18px;
        border-radius: 50%;
        border: 2px solid #ff6600;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="pulse"></div>
    <svg id="cursor" viewBox="0 0 26 30" aria-hidden="true">
      <path
        d="M2 2 L2 24 L8.2 18.4 L12.6 27.4 L16.8 25.4 L12.4 16.6 L20.6 16.6 Z"
        fill="#ff6600"
        stroke="#fff"
        stroke-width="2"
        stroke-linejoin="round"
      />
    </svg>
    <script src="cursor.js"></script>
  </body>
</html>
