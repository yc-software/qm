display_information:
  name: qm
  description: QM workspace agent
  background_color: "#1f2937"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: qm
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - chat:write.customize
      - im:history
      - im:read
      - im:write
      - users:read
      - users:read.email
      - channels:read
      - channels:history
      - channels:manage
      - groups:read
      - groups:history
      - groups:write
      - mpim:read
      - mpim:write
      - mpim:history
      - files:read
      - files:write
      - reactions:write
      - reactions:read
      - pins:read
      - pins:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
      - message.mpim
      - member_joined_channel
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
