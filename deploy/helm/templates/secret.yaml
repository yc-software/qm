{{- if include "qm.hasSecretEnv" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qm.fullname" . }}-env
  labels:
    {{- include "qm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $moved := splitList " " (include "qm.webUiAccessKeys" .) }}
  {{- range $k, $v := .Values.secretEnv }}
  {{- if and $v (not (has $k $moved)) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
