{{- $database := include "qm.databaseEnvNames" . | fromJsonArray }}
{{- if include "qm.hasSecretEnv" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qm.fullname" . }}-env
  labels:
    {{- include "qm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secretEnv }}
  {{- if and $v (not (has $k $database)) }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- if include "qm.hasDatabaseEnv" . }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qm.fullname" . }}-database
  labels:
    {{- include "qm.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k := $database }}
  {{- with index $.Values.secretEnv $k }}
  {{ $k }}: {{ . | quote }}
  {{- end }}
  {{- end }}
{{- end }}
