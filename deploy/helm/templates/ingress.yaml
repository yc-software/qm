{{- if .Values.ingress.enabled }}
{{- $core := .Values.services.core }}
{{- $port := dict "portal" $core.publicPort "core" $core.port }}
{{- $target := .Values.ingress.service }}
{{- if not (hasKey $port $target) }}
{{- fail "ingress.service must be portal (the edge's public front door) or core (the edge's API port)" }}
{{- end }}
{{- if and (eq $target "portal") (not .Values.services.portal.enabled) }}
{{- fail "ingress.service portal is disabled" }}
{{- end }}
{{- $svcName := printf "%s-core" (include "qm.fullname" .) }}
{{- $svcPort := index $port $target }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "qm.fullname" . }}
  labels:
    {{- include "qm.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls .Values.ingress.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .Values.ingress.tlsSecretName | default (printf "%s-tls" (include "qm.fullname" .)) }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $svcName }}
                port:
                  number: {{ $svcPort }}
    {{- end }}
{{- end }}
