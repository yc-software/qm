{{- range $component, $host := dict "admin" "web-ui" "auth" "portal" }}
{{- if and (index $.Values.services $component).enabled (not (index $.Values.services $host).enabled) }}
{{- fail (printf "%s requires services.%s.enabled=true" $component $host) }}
{{- end }}
{{- end }}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (ne $name "admin") (ne $name "auth") }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qm.fullname" $root }}-{{ $name }}
  labels:
    {{- include "qm.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  {{- if and (eq $name "core") $root.Values.kubernetesSandbox.enabled }}
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      {{- include "qm.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      annotations:
        checksum/secret-env: {{ include (print $root.Template.BasePath "/secret.yaml") $root | sha256sum }}
      labels:
        {{- include "qm.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- if and (eq $name "core") $root.Values.kubernetesSandbox.enabled }}
        qm.dev/sandbox-client: "true"
        {{- end }}
    spec:
      {{- if and (eq $name "core") $root.Values.kubernetesSandbox.enabled }}
      serviceAccountName: {{ include "qm.sandboxManager" $root }}
      {{- end }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.repository }}{{ $root.Values.image.separator | default "/" }}{{ $svc.image }}:{{ $svc.tag | default $root.Values.image.tag | default $root.Chart.AppVersion }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          {{- with $svc.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ ternary "http" "proxy" (eq $svc.type "web") }}
              containerPort: {{ $svc.port }}
          {{- $wired := dict }}
          {{- if and (eq $name "core") $root.Values.kubernetesSandbox.enabled }}
          {{- $_ := set $wired "SANDBOX_BACKEND" "kubernetes" }}
          {{- $_ := set $wired "KUBERNETES_SANDBOX_IMAGE" $root.Values.kubernetesSandbox.image }}
          {{- $_ := set $wired "KUBERNETES_SANDBOX_NAMESPACE" (include "qm.sandboxNamespace" $root) }}
          {{- $_ := set $wired "KUBERNETES_CORE_NAMESPACE" $root.Release.Namespace }}
          {{- $_ := set $wired "KUBERNETES_SANDBOX_RUNTIME_CLASS" $root.Values.kubernetesSandbox.runtimeClassName }}
          {{- $_ := set $wired "KUBERNETES_SANDBOX_STORAGE_CLASS" $root.Values.kubernetesSandbox.storageClassName }}
          {{- $_ := set $wired "KUBERNETES_SANDBOX_STORAGE_SIZE" $root.Values.kubernetesSandbox.storageSize }}
          {{- end }}
          {{- $svcHost := printf "%s-%%s.%s.svc.cluster.local" (include "qm.fullname" $root) $root.Release.Namespace }}
          {{- if ne $name "core" }}
          {{- $_ := set $wired "CORE_API_URL" (printf "http://%s:%v" (printf $svcHost "core") (index $root.Values.services "core").port) }}
          {{- end }}
          {{- $authEnabled := (index $root.Values.services "auth").enabled }}
          {{- $authUpstream := "http://127.0.0.1:8099" }}
          {{- $base := trimSuffix "/" ($root.Values.publicUrl | default "") }}
          {{- $issuer := printf "%s/idp" $base }}
          {{- if eq $name "portal" }}
          {{- $_ := set $wired "WEB_UI_UPSTREAM" (printf "http://%s:%v" (printf $svcHost "web-ui") (index $root.Values.services "web-ui").port) }}
          {{- $_ := set $wired "ADMIN_UPSTREAM" (printf "http://%s:%v/admin" (printf $svcHost "web-ui") (index $root.Values.services "web-ui").port) }}
          {{- if $authEnabled }}
          {{- $_ := set $wired "AUTH_BROKER_UPSTREAM" $authUpstream }}
          {{- $_ := set $wired "AUTH_EMBEDDED" "1" }}
          {{- $_ := set $wired "AUTH_BROKER_PREFIX" "/idp" }}
          {{- end }}
          {{- end }}
          {{- if $root.Values.publicUrl }}
          {{- if eq $name "core" }}
          {{- $_ := set $wired "AGENT_API_URL" $root.Values.publicUrl }}
          {{- $_ := set $wired "PUBLIC_WEB_URL" $root.Values.publicUrl }}
          {{- end }}
          {{- if eq $name "portal" }}
          {{- $_ := set $wired "PORTAL_PUBLIC_URL" $root.Values.publicUrl }}
          {{- if $authEnabled }}
          {{- $_ := set $wired "OIDC_ISSUER" $issuer }}
          {{- $_ := set $wired "OIDC_AUTH_ENDPOINT" (printf "%s/authorize" $issuer) }}
          {{- $_ := set $wired "OIDC_TOKEN_ENDPOINT" (printf "%s/token" $authUpstream) }}
          {{- $_ := set $wired "OIDC_USERINFO_ENDPOINT" (printf "%s/userinfo" $authUpstream) }}
          {{- $_ := set $wired "OIDC_JWKS_URI" (printf "%s/.well-known/jwks.json" $authUpstream) }}
          {{- $_ := set $wired "OIDC_SCOPES" "openid email" }}
          {{- $_ := set $wired "OIDC_PRINCIPAL_CLAIM" "email" }}
          {{- with $root.Values.env.AUTH_ALLOWED_EMAIL_DOMAIN }}
          {{- $_ := set $wired "OIDC_ALLOWED_EMAIL_DOMAIN" . }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- if and (eq $name "portal") $authEnabled }}
          {{- $_ := set $wired "AUTH_ISSUER" $issuer }}
          {{- $_ := set $wired "AUTH_REDIRECT_URI" (printf "%s/auth/callback" $base) }}
          {{- end }}
          {{- if eq $name "web-ui" }}
          {{- $_ := set $wired "WEB_UI_PUBLIC_URL" $root.Values.publicUrl }}
          {{- end }}
          {{- end }}
          {{- if eq $name "web-ui" }}
          {{- $_ := set $wired "ADMIN_BASE_PATH" "/admin" }}
          {{- $_ := set $wired "ADMIN_ENABLED" (ternary "1" "0" (index $root.Values.services "admin").enabled) }}
          {{- end }}
          {{- if or $wired $root.Values.env $svc.env }}
          env:
            {{- range $k, $v := $wired }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $root.Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- $componentEnv := deepCopy ($svc.env | default dict) }}
            {{- $component := "" }}
            {{- if eq $name "portal" }}{{- $component = "auth" }}{{- end }}
            {{- if eq $name "web-ui" }}{{- $component = "admin" }}{{- end }}
            {{- if and $component (index $root.Values.services $component).enabled }}
            {{- range $k, $v := (index $root.Values.services $component).env }}
            {{- if ne $k "PORT" }}
            {{- if and (hasKey $componentEnv $k) (ne (toString (index $componentEnv $k)) (toString $v)) }}
            {{- fail (printf "Conflicting %s settings in %s and %s" $k $name $component) }}
            {{- end }}
            {{- $_ := set $componentEnv $k $v }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- range $k, $v := $componentEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if or (include "qm.hasSecretEnv" $root) $root.Values.envFrom }}
          envFrom:
            {{- if include "qm.hasSecretEnv" $root }}
            - secretRef:
                name: {{ include "qm.fullname" $root }}-env
            {{- end }}
            {{- with $root.Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if $svc.healthPath }}
          readinessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: {{ $svc.port }}
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: {{ $svc.port }}
          {{- else }}
          readinessProbe:
            tcpSocket:
              port: {{ $svc.port }}
          livenessProbe:
            tcpSocket:
              port: {{ $svc.port }}
          {{- end }}
          {{- with $svc.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $svc.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
{{- end }}
