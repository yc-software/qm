app = "qm-portal"
primary_region = "sjc"

[env]
  QM_DEPLOYMENT_ID = "qm-v2:personal:acme:qm"
  PORT = "8080"
  CORE_API_URL = "http://qm-core.internal:8080"
  CORE_ORG_ID = "acme"
  PORTAL_PUBLIC_URL = "https://agent.example.com"
  WEB_UI_UPSTREAM = "http://qm-web-ui.flycast"
  ADMIN_UPSTREAM = "http://qm-admin.internal:8080"
  OIDC_AUTH_ENDPOINT = "https://accounts.google.com/o/oauth2/v2/auth"
  OIDC_TOKEN_ENDPOINT = "https://oauth2.googleapis.com/token"
  OIDC_USERINFO_ENDPOINT = "https://openidconnect.googleapis.com/v1/userinfo"
  OIDC_ISSUER = "https://accounts.google.com"
  OIDC_JWKS_URI = "https://www.googleapis.com/oauth2/v3/certs"
  OIDC_SCOPES = "openid email profile"
  OIDC_PRINCIPAL_CLAIM = "email"
  OIDC_ALLOWED_EMAIL_DOMAIN = "example.com"
  PORTAL_SESSION_TTL_S = "28800"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[http_service.ports]]
    port = 443
    handlers = ["tls", "http"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

kill_signal = "SIGTERM"
kill_timeout = "10s"

[checks]
  [checks.health]
    type = "http"
    port = 8080
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
