apiVersion: v1
kind: Namespace
metadata:
  name: qm-sandboxes
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: qm-sandbox-manager
  namespace: qm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: qm-sandbox-manager
  namespace: qm-sandboxes
rules:
  - apiGroups: [""]
    resources: [pods, persistentvolumeclaims]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: qm-sandbox-manager
  namespace: qm-sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: qm-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: qm-sandbox-manager
    namespace: qm
